name: gdrive-relay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from Google Drive
        run: |
          pip install -q gdown
          mkdir -p assets
          gdown 1byGeYxM_PlLjT72wZsMQvP6popJeWBgt -O assets/cifar10_res18_v1.5.zip
          gdown 1lI1j0_fDDvjIt9JlWAw09X8ks-yrR_H1 -O assets/benchmark_imglist.zip
          ls -la assets
          sha256sum assets/* | tee assets/SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1 assets/* --repo "$GITHUB_REPOSITORY" --title "relay v1" --notes "temporary relay"
